name: 🕷️ 개설강좌 데이터 동기화

on:
  # 매일 새벽 2시 (KST) 자동 실행 — cron은 UTC 기준이므로 17시 = KST 02시
  schedule:
    - cron: '0 17 * * *'
  # 수동 실행 (GitHub Actions 탭에서 직접 트리거 가능)
  workflow_dispatch:
    inputs:
      university:
        description: '크롤링 대상 대학교'
        required: false
        default: 'sunchon'
        type: choice
        options:
          - sunchon

jobs:
  sync-courses:
    name: 강좌 데이터 수집 및 업데이트
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 3.11 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/crawler/requirements.txt

      - name: 📦 의존성 설치
        run: |
          cd scripts/crawler
          pip install -r requirements.txt

      - name: 🕷️ 순천대학교 강좌 크롤링 실행
        run: |
          cd scripts/crawler
          python sunchon_crawler.py
        env:
          # 필요 시 포털 인증 정보를 Secrets로 관리하세요
          # PORTAL_USERNAME: ${{ secrets.PORTAL_USERNAME }}
          # PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          TZ: Asia/Seoul

      - name: 📊 변경된 파일 확인
        id: check-changes
        run: |
          if git diff --quiet src/data/courses/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 강좌 데이터 변경 없음 — 커밋 스킵"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ 강좌 데이터 변경 감지"
            git diff --stat src/data/courses/
          fi

      - name: 📝 변경 데이터 자동 커밋 & 푸시
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/courses/
          TIMESTAMP=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          git commit -m "chore(data): 🕷️ 개설강좌 데이터 자동 업데이트 [$TIMESTAMP KST]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Vercel 배포 트리거 (선택사항)
        if: steps.check-changes.outputs.changed == 'true' && vars.VERCEL_DEPLOY_HOOK_URL != ''
        run: |
          curl -X POST "${{ vars.VERCEL_DEPLOY_HOOK_URL }}"
          echo "✅ Vercel 배포 트리거 완료"
